services:
  gamebook-api:
    image: ghcr.io/meshcaster/backend.gamebook:latest
    container_name: gamebook-api
    restart: unless-stopped
    ports:
      - "5080:5080"
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:5080"
      ConnectionStrings__DefaultConnection: "${DATABASE_URL}"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: gamebook-redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redisdata:
